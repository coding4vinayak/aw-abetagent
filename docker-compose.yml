# Local Postgres for development — matches DATABASE_URL in .env.example.
# `docker compose up -d` → `npx prisma migrate deploy` → `npm run dev`.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: abetagent
      POSTGRES_PASSWORD: abetagent
      POSTGRES_DB: abetagent
    ports:
      - "5432:5432"
    volumes:
      - abetagent-pg:/var/lib/postgresql/data

volumes:
  abetagent-pg:
